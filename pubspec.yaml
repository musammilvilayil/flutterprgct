name: universal_accessibility_assistant
description: Offline-first AI accessibility assistant built with Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  camera: ^0.11.1
  permission_handler: ^12.0.0+1
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_object_detection: ^0.17.1
  google_mlkit_face_detection: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
